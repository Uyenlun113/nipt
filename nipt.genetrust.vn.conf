# ==========================================
# Cấu hình Nginx cho Domain: nipt.genetrust.vn
# File: /etc/nginx/sites-available/nipt.genetrust.vn
# ==========================================

# 1. HTTP Server (Port 80) -> Chuyển hướng sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nipt.genetrust.vn;

    # Cho phép Certbot xác thực SSL Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443) -> Reverse Proxy tới Next.js (Port 3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nipt.genetrust.vn;

    # Đường dẫn chứng chỉ SSL (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/nipt.genetrust.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nipt.genetrust.vn/privkey.pem;

    # Cấu hình bảo mật SSL tối ưu
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Dung lượng tối đa file tải lên (Cho phép upload file PDF dung lượng lớn)
    client_max_body_size 50M;

    # Log files
    access_log /var/log/nginx/nipt.genetrust.vn.access.log;
    error_log /var/log/nginx/nipt.genetrust.vn.error.log;

    # Caching cho Next.js Static Assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Reverse Proxy chính tới ứng dụng Next.js (PM2 port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts cho các tác vụ xử lý PDF nặng
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
